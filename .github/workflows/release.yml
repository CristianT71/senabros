# Arma la app de Windows (.exe) y la de Android (.apk) y las publica en GitHub Releases.
# Se dispara al subir una etiqueta de versión:   git tag v1.0.1 && git push origin v1.0.1
# La web (Vercel) no necesita esto: se actualiza sola con cada push a main.
name: Publicar apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (por ejemplo 1.0.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Versión
        shell: bash
        run: echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Preparar el juego
        run: node apps/build-www.mjs
      - name: Compilar e instalador de Windows
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'

  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Versión
        run: echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Preparar el juego
        run: node apps/build-www.mjs
      - name: Proyecto de Android
        working-directory: apps/android
        run: |
          npm ci --no-audit --no-fund
          npx cap add android
          node prepare.mjs
      - name: Compilar el APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Subir el APK a la versión
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk SenaBros.apk
          TAG="v${APP_VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SENA Bros $APP_VERSION" --notes "Versión $APP_VERSION"
          gh release upload "$TAG" SenaBros.apk --clobber
